[package]
name = "dlpk"
version = "0.2.0"
edition = "2021"
rust-version = "1.74"
license = "MIT OR Apache-2.0"

authors = [
    "Guillaume Fraux <guillaume.fraux@epfl.ch>",
    "Rohit Goswami <rohit.goswami@epfl.ch>",
]

description = "DLPack integration for Rust"

repository = "https://github.com/metatensor/dlpk"
readme = "README.md"
keywords = ["dlpack", "deep-learning", "machine-learning"]

[dependencies]
ndarray = { version = "0.17", optional = true }
# Accept either 0.27 or 0.28 so downstream crates on either line can take
# dlpk as a dep without forcing a pyo3 version conflict. 0.28 has MSRV 1.83
# while 0.27 keeps MSRV 1.74; the MSRV CI job uses `cargo update --precise`
# to pin to 0.27.
pyo3 = { version = ">=0.27, <0.29", optional = true }
ouroboros = { version = "0.18", optional = true }

# 2.3 has MSRV 1.7.0
# 2.5 has MSRV 1.81
half = { version = "<2.5", optional = true }

[features]
ndarray = ["dep:ndarray"]
pyo3 = ["dep:pyo3"]
half = ["dep:half"]
sync = ["dep:ouroboros"]
